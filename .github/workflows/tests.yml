name: Tests
on: [push, pull_request]
permissions:
  contents: read
jobs:
  unit:
    strategy:
      fail-fast: false
      matrix:
        # Standard Intel Mac pool avoids arm64 allocation outages; retain
        # explicit arm64 coverage instead of dropping macOS or a Python version.
        os: [ubuntu-latest, macos-15-intel]
        python: ['3.10', '3.11', '3.12']
        include:
          - os: macos-latest
            python: '3.12'
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: python -m pip install '.[test]'
      - run: python -m pytest tests -q -o addopts=
      - name: Build installable distribution
        run: python -m pip wheel . --no-deps --wheel-dir dist
      - uses: actions/upload-artifact@v4
        with:
          name: wheel-${{ matrix.os }}-${{ matrix.python }}
          path: dist/*.whl
