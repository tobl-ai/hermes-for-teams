name: hermes-for-teams
version: 1.0.0
description: "Automatic native-turn scheduling plus explicit queue; automatic mode requires the optional Hermes core seam"
provides_middleware:
  - gateway_turn_execution
author: Tobl.ai
license: MIT
kind: standalone
platforms:
  - macos
  - linux
provides_tools:
  - teams_submit
  - teams_status
  - teams_cancel
  - teams_workflow
config_schema:
  automatic_enabled:
    type: bool
    default: false
    description: "Bounded ordinary native-turn scheduling; requires the matched gateway_turn_execution core connection"
  automatic_interactive:
    type: int
    default: 2
  automatic_background:
    type: int
    default: 1
  automatic_heavy_bytes:
    type: int
    default: 4096
    description: "UTF-8 input-size lane heuristic, not runtime prediction; positive integer"
  enabled:
    type: bool
    default: false
  trusted_operator_tools:
    type: bool
    default: false
    description: "Only opt in for a trusted operator-only profile; not a multi-user authorization boundary"
  tenant:
    type: str
  profile:
    type: str
  queue_path:
    type: str
  allow_cli_workers:
    type: bool
    default: false
  hermes_executable:
    type: str
  existing_owner_control_home:
    type: str
    description: "Optional operator-only absolute path of an already-ready multiplex owner; never starts a daemon"
  existing_owner_profile_home:
    type: str
    description: "Exact canonical profile home that the existing owner must authenticate and serve"
