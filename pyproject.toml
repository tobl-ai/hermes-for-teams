[project]
name = "hermes-for-teams"
version = "1.2.0"
description = "Native same-thread task branches, physical resource leases and bounded turn scheduling for Hermes Agent"
requires-python = ">=3.10"
license = {text = "MIT"}
dependencies = []

[project.scripts]
hermes-teams = "hermes_for_teams.cli:main"

[tool.setuptools.packages.find]
include = ["hermes_for_teams*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
