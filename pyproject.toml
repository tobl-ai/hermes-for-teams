[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "hermes-for-teams"
version = "0.1.0"
description = "Explicit durable team queue and worker add-on for Hermes Agent"
requires-python = ">=3.10"
license = {text = "MIT"}
dependencies = []

[project.scripts]
hermes-teams = "hermes_for_teams.cli:main"

[tool.setuptools.packages.find]
include = ["hermes_for_teams*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
