[project]
name = "hermes-for-teams"
version = "1.0.0"
description = "Automatic native-turn scheduling and explicit queue add-on for Hermes Agent"
requires-python = ">=3.10"
license = {text = "MIT"}
dependencies = []

[project.scripts]
hermes-teams = "hermes_for_teams.cli:main"

[tool.setuptools.packages.find]
include = ["hermes_for_teams*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
